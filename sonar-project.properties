# Lo demás del análisis (organización, clave, exclusiones, cobertura) lo pasa
# por línea de comandos el flujo compartido, Vasak-OS/.github app.yml. Esto se
# suma a eso: el escáner junta las dos fuentes.

# La regla de «contraseña escrita en el código» (S2068) salta con cualquier
# clave de traducción que diga «password», como `newPasswordMin: New (minimum
# {0})`. Los locales son textos de interfaz y no guardan credenciales, así que
# la regla se apaga sólo ahí: en el resto del código sigue mirando.
sonar.issue.ignore.multicriteria=locales
sonar.issue.ignore.multicriteria.locales.ruleKey=yaml:S2068
sonar.issue.ignore.multicriteria.locales.resourceKey=src-tauri/locales/*.yml
