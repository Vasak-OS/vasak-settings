wayfire:
  plugins:
    categories:
      windows: Windows
      workspaces: Workspaces
      effects: Effects
      system: System
      other: Other
    unknownDescription: Plugin enabled manually in wayfire.ini.
    cannotDisable: This plugin is required for VasakOS to work and cannot be disabled.
    enableToConfigure: Enable the plugin to configure its options.
    autostart:
      label: Autostart
      description: Runs the session when the compositor starts.
      requiredReason: Launches vasak-desktop and publishes the session environment (uwsm finalize).
    command:
      label: Keyboard shortcuts
      description: Runs commands with key combinations.
      requiredReason: "Wayfire handles every VasakOS shortcut: terminal, files, menu, volume and brightness."
    ipc:
      label: IPC
      description: External control channel of the compositor.
      requiredReason: vasak-desktop talks to Wayfire over IPC.
    ipc-rules:
      label: IPC rules
      description: Allows querying and changing windows over IPC.
      requiredReason: Required for vasak-desktop to read and adjust window properties.
    stipc:
      label: Testing IPC
      description: Extension of the IPC channel.
      requiredReason: Complements ipc for desktop integration.
    foreign-toplevel:
      label: Window list
      description: Publishes open windows to the desktop.
      requiredReason: Without this the vasak-desktop taskbar stays empty.
    wayfire-shell:
      label: Panel integration
      description: Protocol for the panel and the menu.
      requiredReason: Provides support for the vasak-desktop panel.
    gtk-shell:
      label: GTK integration
      description: Support for the gtk-shell protocol.
      requiredReason: Required for GTK applications to integrate with the desktop.
    session-lock:
      label: Session lock
      description: Allows locking the screen.
      requiredReason: It is the compositor side of screen locking.
    idle:
      label: Idle
      description: Detects when the computer is idle.
      requiredReason: Without this the automatic idle lock never fires.
    shortcuts-inhibit:
      label: Inhibit shortcuts
      description: Lets apps such as remote desktops capture every key.
    move:
      label: Move windows
      description: Drag windows with the mouse.
    resize:
      label: Resize windows
      description: Change the size with the mouse.
    grid:
      label: Grid snapping
      description: Place windows in halves and corners.
    place:
      label: Automatic placement
      description: Decides where new windows appear.
    decoration:
      label: Window decoration
      description: Title bar and borders drawn by the compositor.
    wm-actions:
      label: Window actions
      description: Fullscreen, always on top, sticky and minimize.
    window-rules:
      label: Window rules
      description: Applies automatic rules per application.
    switcher:
      label: Window switcher
      description: Alt+Tab with animation.
    fast-switcher:
      label: Fast switcher
      description: Cycles between windows without animation.
    vswitch:
      label: Switch desktop
      description: Move between workspaces.
    expo:
      label: Overview
      description: Shows every workspace at once.
    oswitch:
      label: Switch display
      description: Jump between monitors.
    animate:
      label: Animations
      description: Animates opening and closing windows.
    blur:
      label: Blur
      description: Blurs whatever is behind the windows.
    zoom:
      label: Magnifier
      description: Zooms the screen with the mouse wheel.
    wobbly:
      label: Wobbly windows
      description: Windows deform as you move them.
    cube:
      label: Desktop cube
      description: Shows the desktops on a 3D cube.
    alpha:
      label: Transparency
      description: Adjusts the opacity of a window.
    invert:
      label: Invert colors
      description: Inverts the colors of the screen.
    fisheye:
      label: Fisheye
      description: Circular magnifying lens.
    wrot:
      label: Rotate windows
      description: Rotates a window with the mouse.

