    label: Mute audio
    description: Turns audio mute on or off
  KEY_MICMUTE:
    label: Mute microphone
    description: Turns microphone mute on or off
  KEY_CAMERA:
    label: Toggle camera
    description: Turns the built-in camera on or off
  KEY_BRIGHTNESSUP:
    label: Brightness up
    description: Increases the screen brightness
  KEY_BRIGHTNESSDOWN:
    label: Brightness down
    description: Lowers the screen brightness
  KEY_PLAYPAUSE:
    label: Play / Pause
    description: Plays or pauses the active media player
  KEY_STOPCD:
    label: Stop playback
    description: Stops media playback
  KEY_PREVIOUSSONG:
    label: Previous track
    description: Skips to the previous song or track
  KEY_NEXTSONG:
    label: Next track
    description: Skips to the next song or track
