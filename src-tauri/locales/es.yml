views:
  privacySecurity:
    title: Privacidad y seguridad
    description: >-
      Qué aplicaciones pueden usar la cámara y el micrófono de este equipo, y
      cuáles pueden leer tus claves.
    scope: >-
      Esto alcanza a la cámara, al micrófono y a tus credenciales —las claves de
      SSH y GPG junto con los agentes que firman con ellas, el llavero y los
      accesos guardados—, y sólo en las aplicaciones que no instaló el sistema.
      Con la cámara y el micrófono cubre nada más que la vía directa al
      dispositivo; una que se los pida a PipeWire todavía no se detiene. La
      captura de pantalla no está cubierta.
    empty: >-
      Todavía no hay ninguna. Cuando una aplicación intente usar la cámara o el
      micrófono, o leer tus claves, y no tenga permiso, va a aparecer acá para
      que decidas.
    notConfined: >-
      Esta aplicación la instaló el sistema, así que ningún perfil la limita:
      cambiar esto no le quita ni le da acceso.
    forget: Olvidar
    allow: Permitir
    deny: No permitir
    blocked:
      title: 'Bloqueado, esperando tu decisión'
      description: 'Un perfil de seguridad le impidió esto a un programa. Si era algo que esperabas, permitíselo; si no, descartalo y queda bloqueado.'
      permisos: 'Permisos'
      veces: 'intentado {0} veces'
