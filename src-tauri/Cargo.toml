[package]
name = "vasak-settings"
version = "0.8.0"
description = "A Vasak Application (template)"
authors = ["Vasak Group", "Joaquin (Pato) Decima"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vasak_settings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
# Una sola ventana de configuración: la segunda invocación navega la que ya está
# abierta en vez de apilar otra encima. Ver `lib.rs`.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-vicons = "2.2"
#tauri-plugin-vicons = {path = "../../tauri-plugin-vicons"}
tauri-plugin-config-manager = "2"
#tauri-plugin-config-manager = {path = "../../tauri-plugin-config-manager"}
tauri-plugin-system-fonts = "2"
tauri-plugin-i18n-vsk = "2.3.0"
gtk = "0.18"
glib = "0.18"
base64 = "0.22"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
open = "5"
tokio = { version = "1", features = ["net", "io-util", "time", "macros"] }
# TLS para la prueba de conexión de las cuentas de correo. rustls y no
# native-tls: es Rust puro, así que no suma ninguna biblioteca compartida al
# paquete.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Los certificados del sistema y no una lista embebida: un servidor de correo
# casero suele usar una CA propia ya instalada en el equipo, y con las raíces
# compiladas adentro la prueba fallaría sobre una configuración que anda.
rustls-native-certs = "0.8"
url = "2"
once_cell = "1"
dirs = "5"
futures-util = "0.3"
notify = "8"
zbus = { version = "4", default-features = false, features = ["tokio"] }
tauri-plugin-bluetooth-manager = "2"
#tauri-plugin-bluetooth-manager = { path = "../../tauri-plugin-bluetooth-manager" }
tauri-plugin-network-manager = "2"
tauri-plugin-vsk-contextual-menu = "2"
tauri-plugin-vsk-journal = "2"
# Para leer las respuestas PROPFIND del autodescubrimiento de CalDAV/CardDAV.
# Rust puro y sólo lectura: no suma ninguna biblioteca compartida, y un parser
# de XML es justo lo que no conviene escribir a mano contra un servidor ajeno.
roxmltree = "0.21"
# HTTP para el autodescubrimiento de CalDAV/CardDAV. rustls como en el resto:
# Rust puro, sin bibliotecas compartidas nuevas. La misma versión que usa el
# servicio de cuentas, para no arrastrar dos árboles distintos a la ISO.
#
# Se usa un cliente hecho y no HTTP a mano porque acá hay redirecciones,
# longitudes y codificación por trozos de por medio — nada de eso conviene
# escribirlo contra un servidor ajeno.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
#tauri-plugin-network-manager = { path = "../../tauri-plugin-network-manager" }

[features]
# Para poder mirar la ventana sin el servidor de desarrollo.
#
# Sin esta feature, `tauri` sirve la interfaz desde `devUrl` y un binario
# compilado a mano abre una ventana que dice «Could not connect to localhost».
# Con ella la interfaz sale de `dist/`, que es lo que hace el empaquetado.
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1  # Allows LLVM to perform better optimization.
lto = "thin"       # Thin LTO: ~90% de fat LTO, compila mucho más rápido.
opt-level = 3      # Máxima optimización de velocidad.
panic = "abort"    # Higher performance by disabling panic handlers.
strip = true       # Ensures debug symbols are removed.

[dev-dependencies]
# Sólo para el test que valida los catálogos de idioma.
serde_yaml = "0.9"
