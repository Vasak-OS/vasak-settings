[package]
name = "vasak-settings"
version = "0.3.2"
description = "A Vasak Application (template)"
authors = ["Vasak Group", "Joaquin (Pato) Decima"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vasak_settings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
# Una sola ventana de configuración: la segunda invocación navega la que ya está
# abierta en vez de apilar otra encima. Ver `lib.rs`.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-vicons = "2"
#tauri-plugin-vicons = {path = "../../tauri-plugin-vicons"}
tauri-plugin-config-manager = "2"
#tauri-plugin-config-manager = {path = "../../tauri-plugin-config-manager"}
tauri-plugin-system-fonts = "2"
tauri-plugin-i18n-vsk = "2.1.1"
gtk = "0.18"
glib = "0.18"
base64 = "0.22"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
open = "5"
tokio = { version = "1", features = ["net", "io-util", "time"] }
url = "2"
once_cell = "1"
dirs = "5"
futures-util = "0.3"
notify = "8"
zbus = { version = "4", default-features = false, features = ["tokio"] }
tauri-plugin-bluetooth-manager = "2"
#tauri-plugin-bluetooth-manager = { path = "../../tauri-plugin-bluetooth-manager" }
tauri-plugin-network-manager = "2"
tauri-plugin-vsk-contextual-menu = "2"
tauri-plugin-vsk-journal = "2"
#tauri-plugin-network-manager = { path = "../../tauri-plugin-network-manager" }

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1  # Allows LLVM to perform better optimization.
lto = "thin"       # Thin LTO: ~90% de fat LTO, compila mucho más rápido.
opt-level = 3      # Máxima optimización de velocidad.
panic = "abort"    # Higher performance by disabling panic handlers.
strip = true       # Ensures debug symbols are removed.

[dev-dependencies]
# Sólo para el test que valida los catálogos de idioma.
serde_yaml = "0.9"
